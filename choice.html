<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start</title>
    <link rel="stylesheet" href="css/choice.css" />
    <script src="js/choice.js" defer></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
  </head>
  <body>
    <div class="choice-screen">
      <section class="choice-container">
        <div class="choice" id="use-screen">
          <h2>Tryk for at starte</h2>
          <p>For at bruge denne skærm til<br />at skrive på</p>
          <img src="img/tap.png" alt="Tryk ikon" />
        </div>

        <div class="divider"></div>

        <div class="choice">
          <h2>Scan QR-koden</h2>
          <p>For at skrive fra din egen<br />telefon</p>
          <img class="qr-code" src="img/qr-code.png" alt="QR-kode" />
        </div>
      </section>

      <p class="privacy-text">
        Din indsendelse er anonym – uanset om du skriver fra vores skærm eller
        din egen telefon
      </p>
    </div>
  </body>
</html>
