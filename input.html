<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input</title>
    <link rel="stylesheet" href="css/input.css" />
    <script src="js/input.js" defer></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
    </style>
  </head>
  <body>
    <div class="input">
      <button id="input-back-btn">↩ Tilbage</button>
      <textarea id="story-input"></textarea>
      <p id="error-message"></p>
      <button id="send-btn">Send</button>
    </div>
 <div class="keyboard">

  <div class="keyboard-row">
    <button class="key">Q</button>
    <button class="key">W</button>
    <button class="key">E</button>
    <button class="key">R</button>
    <button class="key">T</button>
    <button class="key">Y</button>
    <button class="key">U</button>
    <button class="key">I</button>
    <button class="key">O</button>
    <button class="key">P</button>
    <button class="key">Å</button>
  </div>

  <div class="keyboard-row">
    <button class="key">A</button>
    <button class="key">S</button>
    <button class="key">D</button>
    <button class="key">F</button>
    <button class="key">G</button>
    <button class="key">H</button>
    <button class="key">J</button>
    <button class="key">K</button>
    <button class="key">L</button>
    <button class="key">Æ</button>
    <button class="key">Ø</button>
  </div>

  <div class="keyboard-row">
    <button class="key">Z</button>
    <button class="key">X</button>
    <button class="key">C</button>
    <button class="key">V</button>
    <button class="key">B</button>
    <button class="key">N</button>
    <button class="key">M</button>

    <button class="key">,</button>
    <button class="key">.</button>

 
  </div>

  <div class="keyboard-row">
    <button class="key special-key" data-key="caps">Caps</button>

    <button class="key space-key" data-key="space">Space</button>

    <button class="key special-key" data-key="enter">Enter</button>

    <button class="key special-key" data-key="delete">Delete</button>
  </div>

</div>
  </body>
</html>
